  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;display:flex;justify-content:center;background:{{ theme.outerBg }};font-family:var(--font-body);transition:background .15s;\">\n<div style=\"max-width:440px;width:100%;min-height:100vh;background:{{ theme.page }};color:{{ theme.text }};--surface:{{ theme.surface }};--surfaceSunken:{{ theme.surfaceSunken }};--text2:{{ theme.text2 }};--border:{{ theme.border }};--borderStrong:{{ theme.borderStrong }};--link:{{ theme.link }};box-shadow:0 0 40px rgba(0,0,0,0.08);padding:20px 18px 40px;box-sizing:border-box;\">\n\n  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;\">\n    <div style=\"display:flex;align-items:center;gap:10px;min-width:0;\">\n      <img src=\"15b06106-1d74-4ccf-b6c6-e8ebe52ec5de\" alt=\"Wandering Trails, Wagging Tails\" style=\"height:32px;width:32px;object-fit:cover;border-radius:8px;flex:none;\">\n      <div style=\"font-family:var(--font-display);font-weight:700;font-size:1.05rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;\">Towing Limit Checker<\u002Fdiv>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ toggleTheme }}\" aria-label=\"Toggle dark mode\" style=\"width:36px;height:36px;flex:none;border-radius:999px;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;\">\n      <sc-if value=\"{{ themeIsDark }}\" hint-placeholder-val=\"{{ false }}\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#f6efe4\" stroke-width=\"2\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z\"><\u002Fpath><\u002Fsvg>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ themeIsLight }}\" hint-placeholder-val=\"{{ true }}\">\n        <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2a2a28\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4.5\"><\u002Fcircle><path d=\"M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1\"><\u002Fpath><\u002Fsvg>\n      <\u002Fsc-if>\n    <\u002Fbutton>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isStep0 }}\" hint-placeholder-val=\"{{ true }}\">\n    <p style=\"margin:8px 0 0;font-size:0.85rem;color:var(--text2);line-height:1.5;\">Enter your rig's ratings and a CAT Scale weigh ticket to see whether the Tow Vehicle and Trailer are within every weight limit. Fully offline — nothing is saved.<\u002Fp>\n  <\u002Fsc-if>\n\n  <div style=\"display:flex;gap:4px;margin-top:16px;\">\n    <div style=\"flex:1;height:4px;border-radius:2px;background:{{ segColor0 }};\"><\u002Fdiv>\n    <div style=\"flex:1;height:4px;border-radius:2px;background:{{ segColor1 }};\"><\u002Fdiv>\n    <div style=\"flex:1;height:4px;border-radius:2px;background:{{ segColor2 }};\"><\u002Fdiv>\n    <div style=\"flex:1;height:4px;border-radius:2px;background:{{ segColor3 }};\"><\u002Fdiv>\n    <div style=\"flex:1;height:4px;border-radius:2px;background:{{ segColor4 }};\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"text-align:right;font-size:0.72rem;color:var(--text2);margin-top:4px;\">Step {{ stepNum }} of 5<\u002Fdiv>\n\n  <div style=\"margin-top:18px;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:22px 18px;\">\n\n    <sc-if value=\"{{ isStep0 }}\" hint-placeholder-val=\"{{ true }}\">\n      <h2 style=\"margin:0;font-family:var(--font-display);font-size:1.3rem;\">Tow Vehicle ratings<\u002Fh2>\n      <p style=\"margin:8px 0 18px;font-size:0.88rem;color:var(--text2);line-height:1.5;\">From the Tow Vehicle's certification label, plus its GCWR from the owner's manual (never printed on a tag).<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">GVWR (lb)<\u002Flabel>\n          <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"e.g. 10000\" value=\"{{ truck.gvwr }}\" sc-camel-on-change=\"{{ setTruckGvwr }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">Front GAWR (lb)<\u002Flabel>\n          <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"e.g. 4500\" value=\"{{ truck.frontGawr }}\" sc-camel-on-change=\"{{ setTruckFrontGawr }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">Rear GAWR (lb)<\u002Flabel>\n          <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"e.g. 6500\" value=\"{{ truck.rearGawr }}\" sc-camel-on-change=\"{{ setTruckRearGawr }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">GCWR (lb) — optional<\u002Flabel>\n          <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"leave blank if not on file\" value=\"{{ truck.gcwr }}\" sc-camel-on-change=\"{{ setTruckGcwr }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <button sc-camel-on-click=\"{{ goNext }}\" disabled=\"{{ disableNext0 }}\" style=\"margin-top:22px;width:100%;height:52px;border-radius:999px;border:none;background:#f0942f;color:#fff;font-family:var(--font-display);font-weight:700;font-size:1rem;cursor:pointer;opacity:{{ nextOpacity0 }};box-shadow:0 6px 16px rgba(0,0,0,0.12);\">Next<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ loadSample }}\" style=\"margin-top:14px;background:none;border:none;padding:0;color:var(--link);font-size:0.85rem;text-decoration:underline;cursor:pointer;display:block;\">Preview sample results →<\u002Fbutton>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStep1 }}\" hint-placeholder-val=\"{{ false }}\">\n      <h2 style=\"margin:0;font-family:var(--font-display);font-size:1.3rem;\">Trailer ratings<\u002Fh2>\n      <p style=\"margin:8px 0 18px;font-size:0.88rem;color:var(--text2);line-height:1.5;\">From the Trailer's certification label. GAWR is the single per-axle figure; Axle Count multiplies it into a group rating comparable to the Trailer Axle reading on a CAT Scale Ticket.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">GVWR (lb)<\u002Flabel>\n          <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"e.g. 9500\" value=\"{{ trailer.gvwr }}\" sc-camel-on-change=\"{{ setTrailerGvwr }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">GAWR per axle (lb)<\u002Flabel>\n          <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"e.g. 5200\" value=\"{{ trailer.gawr }}\" sc-camel-on-change=\"{{ setTrailerGawr }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">Axle Count<\u002Flabel>\n          <input type=\"number\" min=\"1\" max=\"10\" step=\"1\" value=\"{{ trailer.axleCount }}\" sc-camel-on-change=\"{{ setTrailerAxleCount }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">UVW (lb) — optional<\u002Flabel>\n          <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"leave blank if unknown\" value=\"{{ trailer.uvw }}\" sc-camel-on-change=\"{{ setTrailerUvw }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;margin-top:22px;\">\n        <button sc-camel-on-click=\"{{ goBack }}\" style=\"width:110px;height:52px;flex:none;border-radius:999px;border:2px solid #4d7a3a;background:transparent;color:{{ theme.linkStrong }};font-family:var(--font-display);font-weight:700;font-size:0.95rem;cursor:pointer;\">Back<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goNext }}\" disabled=\"{{ disableNext1 }}\" style=\"flex:1;height:52px;border-radius:999px;border:none;background:#f0942f;color:#fff;font-family:var(--font-display);font-weight:700;font-size:1rem;cursor:pointer;opacity:{{ nextOpacity1 }};box-shadow:0 6px 16px rgba(0,0,0,0.12);\">Next<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStep2 }}\" hint-placeholder-val=\"{{ false }}\">\n      <h2 style=\"margin:0;font-family:var(--font-display);font-size:1.3rem;\">Combined Ticket<\u002Fh2>\n      <p style=\"margin:8px 0 18px;font-size:0.88rem;color:var(--text2);line-height:1.5;\">The CAT Scale Ticket from weighing the Tow Vehicle and Trailer hitched together.<\u002Fp>\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">Steer Axle (lb)<\u002Flabel>\n          <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"e.g. 4300\" value=\"{{ combined.steer }}\" sc-camel-on-change=\"{{ setCombinedSteer }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">Drive Axle (lb)<\u002Flabel>\n          <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"e.g. 6100\" value=\"{{ combined.drive }}\" sc-camel-on-change=\"{{ setCombinedDrive }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">Trailer Axle group (lb)<\u002Flabel>\n          <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"e.g. 9200\" value=\"{{ combined.trailerAxle }}\" sc-camel-on-change=\"{{ setCombinedTrailerAxle }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;\">\n          <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">Gross Weight (lb)<\u002Flabel>\n          <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"e.g. 19600\" value=\"{{ combined.gross }}\" sc-camel-on-change=\"{{ setCombinedGross }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:10px;margin-top:22px;\">\n        <button sc-camel-on-click=\"{{ goBack }}\" style=\"width:110px;height:52px;flex:none;border-radius:999px;border:2px solid #4d7a3a;background:transparent;color:{{ theme.linkStrong }};font-family:var(--font-display);font-weight:700;font-size:0.95rem;cursor:pointer;\">Back<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goNext }}\" disabled=\"{{ disableNext2 }}\" style=\"flex:1;height:52px;border-radius:999px;border:none;background:#f0942f;color:#fff;font-family:var(--font-display);font-weight:700;font-size:1rem;cursor:pointer;opacity:{{ nextOpacity2 }};box-shadow:0 6px 16px rgba(0,0,0,0.12);\">Next<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStep3 }}\" hint-placeholder-val=\"{{ false }}\">\n      <h2 style=\"margin:0;font-family:var(--font-display);font-size:1.3rem;\">Solo Ticket (optional)<\u002Fh2>\n      <p style=\"margin:8px 0 16px;font-size:0.88rem;color:var(--text2);line-height:1.5;\">If you also weighed the Tow Vehicle alone on the same trip, add that ticket: it lets the Trailer GVWR check run off the Derived Trailer Weight. Skip it and that one check is reported as Not Evaluated.<\u002Fp>\n      <label style=\"display:flex;align-items:center;gap:12px;cursor:pointer;padding:14px;border-radius:14px;background:var(--surfaceSunken);\">\n        <input type=\"checkbox\" checked=\"{{ hasSolo }}\" sc-camel-on-change=\"{{ toggleHasSolo }}\" style=\"width:22px;height:22px;accentColor:#f0942f;flex:none;\">\n        <span style=\"font-size:0.92rem;\">I also weighed the truck alone<\u002Fspan>\n      <\u002Flabel>\n      <sc-if value=\"{{ hasSolo }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:14px;margin-top:16px;\">\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">Solo Steer Axle (lb)<\u002Flabel>\n            <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"e.g. 4300\" value=\"{{ solo.steer }}\" sc-camel-on-change=\"{{ setSoloSteer }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">Solo Drive Axle (lb)<\u002Flabel>\n            <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"e.g. 6200\" value=\"{{ solo.drive }}\" sc-camel-on-change=\"{{ setSoloDrive }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">Solo Gross Weight (lb)<\u002Flabel>\n            <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"e.g. 10500\" value=\"{{ solo.gross }}\" sc-camel-on-change=\"{{ setSoloGross }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px;\">\n            <label style=\"font-weight:600;font-size:0.85rem;color:var(--text2);\">Hours between the two weighings — optional<\u002Flabel>\n            <input type=\"number\" sc-camel-input-mode=\"decimal\" placeholder=\"leave blank if unknown\" value=\"{{ timeGapHours }}\" sc-camel-on-change=\"{{ setTimeGap }}\" style=\"height:52px;padding:0 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--surfaceSunken);color:{{ theme.text }};font-size:1.05rem;width:100%;box-sizing:border-box;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ hasSoloOff }}\" hint-placeholder-val=\"{{ true }}\">\n        <p style=\"margin:10px 0 0;font-size:0.78rem;color:var(--text2);\">Leave the box above unchecked to go straight to the results.<\u002Fp>\n      <\u002Fsc-if>\n      <div style=\"display:flex;gap:10px;margin-top:22px;\">\n        <button sc-camel-on-click=\"{{ goBack }}\" style=\"width:110px;height:52px;flex:none;border-radius:999px;border:2px solid #4d7a3a;background:transparent;color:{{ theme.linkStrong }};font-family:var(--font-display);font-weight:700;font-size:0.95rem;cursor:pointer;\">Back<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goNext }}\" disabled=\"{{ disableNext3 }}\" style=\"flex:1;height:52px;border-radius:999px;border:none;background:#f0942f;color:#fff;font-family:var(--font-display);font-weight:700;font-size:1rem;cursor:pointer;opacity:{{ nextOpacity3 }};box-shadow:0 6px 16px rgba(0,0,0,0.12);\">See results<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isStep4 }}\" hint-placeholder-val=\"{{ false }}\">\n      <h2 style=\"margin:0;font-family:var(--font-display);font-size:1.3rem;\">Rig Evaluation<\u002Fh2>\n\n      <div style=\"margin-top:14px;padding:14px 16px;border-radius:14px;background:{{ banner.bg }};color:{{ banner.text }};font-size:0.9rem;line-height:1.45;font-weight:500;\">\n        {{ banner.msg }}\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px;\">\n        <sc-for list=\"{{ gridChecks }}\" as=\"check\" hint-placeholder-count=\"6\">\n          <div style=\"background:{{ check.fill }};color:#ffffff;border-radius:12px;padding:10px 9px;min-height:112px;display:flex;flex-direction:column;gap:5px;border:{{ check.borderStyle }};\">\n            <div style=\"display:flex;align-items:center;gap:5px;\">\n              <sc-if value=\"{{ check.iconCheck }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;\"><path d=\"M4 12l6 6L20 6\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              <sc-if value=\"{{ check.iconWarn }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;\"><path d=\"M12 3l10 18H2z\"><\u002Fpath><line x1=\"12\" y1=\"10\" x2=\"12\" y2=\"14.5\"><\u002Fline><circle cx=\"12\" cy=\"17.3\" r=\"0.9\" fill=\"#fff\" stroke=\"none\"><\u002Fcircle><\u002Fsvg><\u002Fsc-if>\n              <sc-if value=\"{{ check.iconX }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\" stroke-linecap=\"round\"><path d=\"M5 5l14 14M19 5L5 19\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              <sc-if value=\"{{ check.iconDash }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.5\" stroke-linecap=\"round\"><path d=\"M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n              <span style=\"font-weight:700;font-size:0.72rem;line-height:1.2;\">{{ check.label }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size:0.76rem;font-weight:700;\">{{ check.statusLabel }}<\u002Fdiv>\n            <sc-if value=\"{{ check.hasFigures }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:0.66rem;opacity:0.95;line-height:1.35;\">{{ check.actualText }}<br>vs {{ check.ratingText }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ check.hasNote }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font-size:0.62rem;opacity:0.92;line-height:1.3;\">{{ check.note }}<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ timeGapWarn }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top:14px;padding:12px 14px;border-radius:12px;background:{{ theme.infoBg }};color:{{ theme.infoText }};font-size:0.8rem;line-height:1.5;\">Time-Gap Warning (advisory): the two physical weighings were about {{ gapHoursText }} hours apart. The Trailer may have gained or lost weight in between, so the Trailer GVWR box above is less reliable. This never changes the pass / fail results.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ timeGapOk }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:12px 0 0;font-size:0.72rem;color:var(--text2);\">The two physical weighings were about {{ gapHoursText }} hours apart — within the Time-Gap threshold.<\u002Fp>\n      <\u002Fsc-if>\n\n      <p style=\"margin:16px 0 0;font-size:0.68rem;color:var(--text2);line-height:1.5;\">This tool is for reference only. It does not replace your vehicle and trailer manufacturer's ratings, a professional weigh station, or a professional inspection. Always follow your owner's manuals and local regulations.<\u002Fp>\n\n      <div style=\"display:flex;gap:10px;margin-top:20px;\">\n        <button sc-camel-on-click=\"{{ goBack }}\" style=\"flex:1;height:50px;border-radius:999px;border:2px solid #4d7a3a;background:transparent;color:{{ theme.linkStrong }};font-family:var(--font-display);font-weight:700;font-size:0.92rem;cursor:pointer;\">Back<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ startOver }}\" style=\"flex:1;height:50px;border-radius:999px;border:1.5px solid var(--border);background:transparent;color:{{ theme.text }};font-family:var(--font-display);font-weight:700;font-size:0.92rem;cursor:pointer;\">Start over<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;$preview&quot;: {&quot;width&quot;: 440, &quot;height&quot;: 900},\n  &quot;defaultTheme&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;light&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;tsType&quot;: &quot;'light'|'dark'&quot;, &quot;section&quot;: &quot;Behavior&quot;},\n  &quot;nearLimitThreshold&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 90, &quot;min&quot;: 75, &quot;max&quot;: 99, &quot;step&quot;: 1, &quot;unit&quot;: &quot;%&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Behavior&quot;}\n}\">\nclass Component extends DCLogic {\n  state = {\n    step: 0,\n    theme: (this.props && this.props.defaultTheme) || 'light',\n    truck: { gvwr: '', frontGawr: '', rearGawr: '', gcwr: '' },\n    trailer: { gvwr: '', gawr: '', axleCount: '2', uvw: '' },\n    combined: { steer: '', drive: '', trailerAxle: '', gross: '' },\n    hasSolo: false,\n    solo: { steer: '', drive: '', gross: '' },\n    timeGapHours: '',\n  };\n\n  num(v) { const f = parseFloat(v); return v !== '' && isFinite(f) ? f : null; }\n\n  setField = (group, key, e) => {\n    const value = e.target.value;\n    this.setState(s => ({ [group]: { ...s[group], [key]: value } }));\n  };\n  setTruckGvwr = e => this.setField('truck', 'gvwr', e);\n  setTruckFrontGawr = e => this.setField('truck', 'frontGawr', e);\n  setTruckRearGawr = e => this.setField('truck', 'rearGawr', e);\n  setTruckGcwr = e => this.setField('truck', 'gcwr', e);\n  setTrailerGvwr = e => this.setField('trailer', 'gvwr', e);\n  setTrailerGawr = e => this.setField('trailer', 'gawr', e);\n  setTrailerAxleCount = e => this.setField('trailer', 'axleCount', e);\n  setTrailerUvw = e => this.setField('trailer', 'uvw', e);\n  setCombinedSteer = e => this.setField('combined', 'steer', e);\n  setCombinedDrive = e => this.setField('combined', 'drive', e);\n  setCombinedTrailerAxle = e => this.setField('combined', 'trailerAxle', e);\n  setCombinedGross = e => this.setField('combined', 'gross', e);\n  setSoloSteer = e => this.setField('solo', 'steer', e);\n  setSoloDrive = e => this.setField('solo', 'drive', e);\n  setSoloGross = e => this.setField('solo', 'gross', e);\n  setTimeGap = e => this.setState({ timeGapHours: e.target.value });\n  toggleHasSolo = () => this.setState(s => ({ hasSolo: !s.hasSolo }));\n\n  goNext = () => this.setState(s => ({ step: Math.min(4, s.step + 1) }));\n  goBack = () => this.setState(s => ({ step: Math.max(0, s.step - 1) }));\n  toggleTheme = () => this.setState(s => ({ theme: s.theme === 'light' ? 'dark' : 'light' }));\n  startOver = () => this.setState({\n    step: 0,\n    truck: { gvwr: '', frontGawr: '', rearGawr: '', gcwr: '' },\n    trailer: { gvwr: '', gawr: '', axleCount: '2', uvw: '' },\n    combined: { steer: '', drive: '', trailerAxle: '', gross: '' },\n    hasSolo: false,\n    solo: { steer: '', drive: '', gross: '' },\n    timeGapHours: '',\n  });\n  loadSample = () => this.setState({\n    step: 4,\n    truck: { gvwr: '10000', frontGawr: '4500', rearGawr: '6500', gcwr: '22000' },\n    trailer: { gvwr: '9500', gawr: '5200', axleCount: '2', uvw: '7200' },\n    combined: { steer: '4300', drive: '6100', trailerAxle: '9200', gross: '19600' },\n    hasSolo: true,\n    solo: { steer: '4300', drive: '6200', gross: '10500' },\n    timeGapHours: '3.5',\n  });\n\n  evaluate() {\n    const n = this.num.bind(this);\n    const { truck, trailer, combined, hasSolo, solo } = this.state;\n    const threshold = ((this.props && this.props.nearLimitThreshold) || 90) / 100;\n\n    const truckGvwr = n(truck.gvwr), frontGawr = n(truck.frontGawr), rearGawr = n(truck.rearGawr), gcwr = n(truck.gcwr);\n    const trailerGvwr = n(trailer.gvwr), gawr = n(trailer.gawr), axleCount = n(trailer.axleCount) || 1;\n    const steer = n(combined.steer), drive = n(combined.drive), trailerAxle = n(combined.trailerAxle), gross = n(combined.gross);\n\n    const STYLE = {\n      PASS: { fill: '#335a2b', label: 'Pass' },\n      NEAR_LIMIT: { fill: '#8a4d12', label: 'Near Limit' },\n      FAIL: { fill: '#a8402f', label: 'Fail' },\n      NOT_EVALUATED: { fill: '#4f4d48', label: 'Not Evaluated' },\n    };\n\n    const mk = (label, actual, rating, nearLimit) => {\n      let status;\n      if (actual == null || rating == null) status = 'NOT_EVALUATED';\n      else if (actual > rating) status = 'FAIL';\n      else if (nearLimit && actual >= rating * threshold) status = 'NEAR_LIMIT';\n      else status = 'PASS';\n      const st = STYLE[status];\n      return {\n        label, status, statusLabel: st.label, fill: st.fill,\n        hasFigures: actual != null && rating != null,\n        actualText: actual != null ? Math.round(actual) + ' lb' : '',\n        ratingText: rating != null ? Math.round(rating) + ' lb' : '',\n        hasNote: status === 'NOT_EVALUATED',\n        note: status === 'NOT_EVALUATED' ? 'Not enough data to check this one.' : '',\n        iconCheck: status === 'PASS', iconWarn: status === 'NEAR_LIMIT', iconX: status === 'FAIL', iconDash: status === 'NOT_EVALUATED',\n        borderStyle: status === 'PASS' ? '1px solid rgba(255,255,255,.28)' : status === 'NEAR_LIMIT' ? '2px dashed rgba(255,255,255,.6)' : status === 'FAIL' ? '2px solid rgba(255,255,255,.7)' : '2px dotted rgba(255,255,255,.4)',\n      };\n    };\n\n    let derived = null;\n    if (hasSolo) {\n      const ss = n(solo.steer), sd = n(solo.drive);\n      if (gross != null && ss != null && sd != null) derived = gross - (ss + sd);\n    }\n    const trailerGvwrNote = hasSolo ? '' : 'Add a Solo Ticket to evaluate this check.';\n\n    const checks = [\n      mk('Steer Axle', steer, frontGawr),\n      mk('Drive Axle', drive, rearGawr),\n      mk('Trailer Axle', trailerAxle, gawr != null ? gawr * axleCount : null),\n      mk('Hitched GVWR', (steer != null && drive != null) ? steer + drive : null, truckGvwr),\n      mk('GCWR', gross, gcwr),\n      mk('Trailer GVWR', derived, trailerGvwr, true),\n    ];\n    if (checks[5].status === 'NOT_EVALUATED' && trailerGvwrNote) checks[5].note = trailerGvwrNote;\n\n    let overall = 'NOT_EVALUATED';\n    if (checks.some(c => c.status === 'FAIL')) overall = 'FAIL';\n    else if (checks.some(c => c.status === 'NEAR_LIMIT')) overall = 'NEAR_LIMIT';\n    else if (checks.some(c => c.status === 'PASS')) overall = 'PASS';\n\n    return { checks, overall };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const isDark = s.theme === 'dark';\n    const LIGHT = { outerBg: '#ece1cf', page: '#f6efe4', surface: '#ffffff', surfaceSunken: '#f1e9d9', text: '#2a2a28', text2: '#4a4844', border: 'rgba(42,42,40,0.16)', borderStrong: 'rgba(42,42,40,0.32)', link: '#33552b', linkStrong: '#33552b', infoBg: '#f1eef5', infoText: '#4a3f60' };\n    const DARK = { outerBg: '#141311', page: '#201f1c', surface: '#2c2b28', surfaceSunken: '#242320', text: '#f6efe4', text2: '#cbc3b6', border: 'rgba(246,239,228,0.16)', borderStrong: 'rgba(246,239,228,0.34)', link: '#8bbf72', linkStrong: '#8bbf72', infoBg: '#2c283a', infoText: '#c4b8dd' };\n    const theme = isDark ? DARK : LIGHT;\n\n    const n = this.num.bind(this);\n    const valid0 = n(s.truck.gvwr) > 0 && n(s.truck.frontGawr) > 0 && n(s.truck.rearGawr) > 0;\n    const valid1 = n(s.trailer.gvwr) > 0 && n(s.trailer.gawr) > 0;\n    const valid2 = n(s.combined.steer) > 0 && n(s.combined.drive) > 0 && n(s.combined.trailerAxle) > 0 && n(s.combined.gross) > 0;\n    const valid3 = !s.hasSolo || (n(s.solo.steer) > 0 && n(s.solo.drive) > 0 && n(s.solo.gross) > 0);\n\n    let gridChecks = [], banner = null, timeGapWarn = false, timeGapOk = false, gapHoursText = '';\n    if (s.step === 4) {\n      const evalr = this.evaluate();\n      gridChecks = evalr.checks;\n      const BANNER = isDark ? {\n        FAIL: { bg: '#3a201c', text: '#f2a99c', msg: 'This rig is over at least one legal limit — do not tow as loaded.' },\n        NEAR_LIMIT: { bg: '#3a2a14', text: '#f0b878', msg: 'Nothing is over a limit, but at least one check is close to one.' },\n        PASS: { bg: '#223a1c', text: '#a8cf99', msg: 'Every evaluated check is within its limit.' },\n        NOT_EVALUATED: { bg: '#2c283a', text: '#c4b8dd', msg: 'There was not enough information to evaluate this rig.' },\n      } : {\n        FAIL: { bg: '#fbe9e6', text: '#8a2f24', msg: 'This rig is over at least one legal limit — do not tow as loaded.' },\n        NEAR_LIMIT: { bg: '#fdf0e0', text: '#7a3d0d', msg: 'Nothing is over a limit, but at least one check is close to one.' },\n        PASS: { bg: '#e9f1e3', text: '#2a4322', msg: 'Every evaluated check is within its limit.' },\n        NOT_EVALUATED: { bg: '#f1eef5', text: '#4a3f60', msg: 'There was not enough information to evaluate this rig.' },\n      };\n      banner = BANNER[evalr.overall];\n      if (s.hasSolo && s.timeGapHours !== '') {\n        const gap = Math.abs(n(s.timeGapHours));\n        gapHoursText = String(gap);\n        if (gap > 2) timeGapWarn = true; else timeGapOk = true;\n      }\n    }\n\n    const orange = '#f0942f';\n    return {\n      theme, themeIsDark: isDark, themeIsLight: !isDark, toggleTheme: this.toggleTheme,\n      isStep0: s.step === 0, isStep1: s.step === 1, isStep2: s.step === 2, isStep3: s.step === 3, isStep4: s.step === 4,\n      stepNum: s.step + 1,\n      segColor0: s.step >= 0 ? orange : 'var(--border)',\n      segColor1: s.step >= 1 ? orange : 'var(--border)',\n      segColor2: s.step >= 2 ? orange : 'var(--border)',\n      segColor3: s.step >= 3 ? orange : 'var(--border)',\n      segColor4: s.step >= 4 ? orange : 'var(--border)',\n      truck: s.truck, trailer: s.trailer, combined: s.combined, solo: s.solo, hasSolo: s.hasSolo, hasSoloOff: !s.hasSolo, timeGapHours: s.timeGapHours,\n      setTruckGvwr: this.setTruckGvwr, setTruckFrontGawr: this.setTruckFrontGawr, setTruckRearGawr: this.setTruckRearGawr, setTruckGcwr: this.setTruckGcwr,\n      setTrailerGvwr: this.setTrailerGvwr, setTrailerGawr: this.setTrailerGawr, setTrailerAxleCount: this.setTrailerAxleCount, setTrailerUvw: this.setTrailerUvw,\n      setCombinedSteer: this.setCombinedSteer, setCombinedDrive: this.setCombinedDrive, setCombinedTrailerAxle: this.setCombinedTrailerAxle, setCombinedGross: this.setCombinedGross,\n      toggleHasSolo: this.toggleHasSolo, setSoloSteer: this.setSoloSteer, setSoloDrive: this.setSoloDrive, setSoloGross: this.setSoloGross, setTimeGap: this.setTimeGap,\n      goNext: this.goNext, goBack: this.goBack, startOver: this.startOver, loadSample: this.loadSample,\n      disableNext0: !valid0, disableNext1: !valid1, disableNext2: !valid2, disableNext3: !valid3,\n      nextOpacity0: valid0 ? 1 : 0.5, nextOpacity1: valid1 ? 1 : 0.5, nextOpacity2: valid2 ? 1 : 0.5, nextOpacity3: valid3 ? 1 : 0.5,\n      gridChecks, banner, timeGapWarn, timeGapOk, gapHoursText,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
