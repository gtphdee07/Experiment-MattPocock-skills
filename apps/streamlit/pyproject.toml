[project]
name = "towing-streamlit"
version = "0.1.0"
description = "Towing Limit Checker: standalone offline Streamlit calculator (compute tier only)"
requires-python = ">=3.12"
dependencies = ["streamlit>=1.40", "towing-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
towing-core = { workspace = true }
