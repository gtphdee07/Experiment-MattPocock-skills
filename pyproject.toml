[tool.uv.workspace]
members = ["packages/*", "apps/*"]
# apps/web (issue #30) is an npm-managed TypeScript/React app, not a uv/Python
# workspace member - it has no pyproject.toml on purpose. Excluded explicitly
# so `uv sync`/`uv run` don't try to treat it as a (missing) Python package.
exclude = ["apps/web"]

[tool.uv.sources]
towing-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/towing-core/tests",
    "packages/towing-app/tests",
    "apps/cli/tests",
    "apps/streamlit/tests",
    "apps/backend/tests",
]

[tool.mypy]
python_version = "3.12"
strict = true
# docs/design/ holds Claude Design reference deliverables (a FastAPI + React
# bundle, a Streamlit main() patch snippet) - illustrative code, not part of
# any package, and it imports libraries the workspace doesn't install.
# apps/web (issue #30) is the promoted TypeScript/React app - not Python.
exclude = ['^docs/design/', '^apps/web/']

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["docs/design", "apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["towing_core", "towing_app", "towing_cli", "towing_streamlit", "towing_backend"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is exactly `Depends(...)`/`File(...)`/
# `Form(...)`/`Query(...)` as an argument default (apps/backend); B008 exists
# to catch a real footgun in general Python, but flags this pattern as a
# false positive. `File`/`Form` added alongside `Depends` for issue #20's
# multipart upload endpoints (`UploadFile = File(...)`, a ticket-type form
# field).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.File",
    "fastapi.params.File",
    "fastapi.Form",
    "fastapi.params.Form",
    "fastapi.Query",
    "fastapi.params.Query",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.16.6",
    "httpx>=0.27",
]
