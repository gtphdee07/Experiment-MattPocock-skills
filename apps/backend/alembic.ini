[alembic]
script_location = alembic

# Overridden at runtime by towing_backend.migrate.run_migrations for every
# real caller (the app factory, tests); this is only the fallback used by
# the bare `alembic` CLI during manual/dev use.
sqlalchemy.url = sqlite+aiosqlite:///./.dev-data/backend.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
