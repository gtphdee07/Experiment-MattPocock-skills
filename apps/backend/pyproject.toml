[project]
name = "towing-backend"
version = "0.1.0"
description = "Towing Limit Checker: Phase 2 backend (Account registration/login/session auth, Garage auto-provisioning)"
requires-python = ">=3.12"
dependencies = [
    "towing-core",
    # Issue #20: the first backend feature needing the application-services
    # tier, not just the compute tier - reuses towing_app.field_acquisition's
    # ClaudeVision*/WebAxleCountFieldSource adapters (and, transitively,
    # `anthropic`) unmodified, rather than reimplementing them here.
    "towing-app",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "fastapi-users[sqlalchemy]>=14.0",
    "pydantic>=2.0",
    # Async DB drivers: fastapi-users' SQLAlchemy adapter (>=6) is
    # async-only (fastapi_users_db_sqlalchemy.SQLAlchemyUserDatabase takes
    # an AsyncSession), so both the SQLite (dev/test) and Postgres
    # (production) engines need their async driver even though ADR 0011's
    # "Synchronous endpoints" bullet was written before checking that.
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    # Issue #21: `towing_app.services.record_weigh_event` is reused
    # unmodified and is fully synchronous - it needs a synchronous
    # SQLAlchemy engine (towing_backend.sync_db), separate from the async
    # engine every other table above uses. `asyncpg` has no sync mode, so
    # Postgres needs its own sync-capable driver for that second engine;
    # SQLite's sync dialect needs no separate driver (stdlib `sqlite3`).
    "psycopg2-binary>=2.9",
    # Issue #38: /api/evaluate is the one fully unauthenticated route (the
    # free calculator has to stay anonymous per ADR 0013), so it needs its
    # own abuse mitigation - every other route relies on session auth for
    # that instead.
    "slowapi>=0.1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
towing-core = { workspace = true }
towing-app = { workspace = true }
