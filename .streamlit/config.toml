# Streamlit theme for apps/streamlit (Towing Limit Checker) — the WTWT design
# system. See docs/design/streamlit/DELIVERABLE.md and docs/design/design-tokens.md.
#
# This lives at the repo root, not apps/streamlit/, on purpose: Streamlit reads
# .streamlit/config.toml relative to the working directory `streamlit run` is
# invoked from — the repo root both locally
# (`uv run streamlit run apps/streamlit/streamlit_app.py`) and on Streamlit
# Community Cloud (CWD = repo checkout root). A copy under apps/streamlit/ would
# not be picked up.

[theme]
base = "light"
primaryColor = "#f0942f"
backgroundColor = "#f6efe4"
secondaryBackgroundColor = "#ece1cf"
textColor = "#2a2a28"
linkColor = "#33552b"
borderColor = "#ddd3c0"
showWidgetBorder = true
baseRadius = "1rem"
baseFontSize = 16
font = "Karla"
headingFont = "Quicksand"

[theme.sidebar]
backgroundColor = "#ece1cf"
borderColor = "#ddd3c0"
