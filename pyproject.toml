[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
towing-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/towing-core/tests",
    "packages/towing-app/tests",
    "apps/cli/tests",
    "apps/streamlit/tests",
]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["towing_core", "towing_app", "towing_cli", "towing_streamlit"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.16.6",
]
