[project]
name = "towing-app"
version = "0.1.0"
description = "Towing Limit Checker: garage, weigh events, and overload checks"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["towing_app*"]

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
towing-core = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.16.6",
    "towing-core",
]
